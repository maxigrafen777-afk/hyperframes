[project]
name = "clip-pipeline"
version = "0.1.0"
description = "Livestreams aufnehmen, Highlights per Chat erkennen, als 9:16-Clip schneiden und aufs Handy schicken."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "websockets>=12",
  "streamlink>=6",
  "anthropic>=2.10",
  "faster-whisper>=1.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clip-pipeline = "pipeline.orchestrator:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
