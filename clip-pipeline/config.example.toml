# Kopieren nach config.toml und anpassen.

data_dir = "data"

# Nur aufnehmen, wenn der Streamer gerade eines dieser Spiele spielt
# (Twitch-Kategoriename, exakt). Leer = alles aufnehmen.
games = ["Grand Theft Auto VI"]

[recorder]
segment_s = 2            # Länge eines Puffer-Segments
buffer_s = 180           # so viel Material hält der Puffer
quality = "1080p60,1080p,best"

[detect]
burst_s = 10             # Fenster für "gerade eben"
baseline_s = 300         # Fenster für "normal"
min_baseline_s = 120     # vorher wird nie ausgelöst
z_threshold = 3.5       # an 30 min echtem Zarbex-Chat eingestellt (18.11.2026)
min_unique_users = 6
min_unique_ratio = 0.5   # verschiedene Nutzer / Nachrichten im Burst
clip_calls_trigger = 3   # so viele verschiedene Nutzer schreiben "clip"
cooldown_s = 60
min_pre_score = 0.35     # darunter fällt der Kandidat sofort weg
# Lachen (hahaha, xD, lol, kekw) wird automatisch erkannt. Hier zusätzlich Emotes:
hype_words = ["LUL", "OMEGALUL", "W", "💀", "😂", "🤣", "PogChamp", "Pog", "POGGERS", "monkaS", "NAHHH", "EYOOOO", "bruh",
              # Kanal-Emotes von Zarbex (aus echtem Chat gezählt)
              "zarbexHehe", "zarbexGeil", "zarbexHyper", "zarbexHype", "zarbexYeah", "zarbexW", "zarbexLost", "zarbexRedFlag"]
# ignore_users, ignore_patterns, answer_words: sinnvolle Standardwerte, siehe pipeline/config.py

[clip]
pre_roll_s = 20          # Sekunden vor dem geschätzten Moment
post_roll_s = 8          # Sekunden nach dem Chat-Ausschlag
max_len_s = 59

[judge]
min_hype = 7
model = "claude-opus-5-5"   # Claude über die Anthropic-API (Schlüssel in .env)
effort = "medium"           # low | medium | high
frames = 6
frame_width = 768

[whisper]
model = "small"             # läuft ohne GPU auf der CPU
compute_type = "int8"
vocabulary = ["GTA", "GTA 6", "Vice City", "Leonida", "Lucia", "Jason", "Keyless Go", "Mustang", "Zarbex",
              "zocken", "zockst", "Privatjet", "Neuseeland", "Chat", "Subs"]
corrections = { schockst = "zockst", schocken = "zocken" }

# Ein Block pro Streamer. Nur Streamer, die Clipping erlauben!
# Vor dem Posten prüfen: erlaubt der Streamer Clipping / gibt es eine Kampagne?
[render]
remove_music = true      # Musik nie veröffentlichen: nur die getrennte Stimmspur
show_credit = false      # kein Twitch-Name im Video; Quelle steht im Post-Text

[[streamers]]
platform = "twitch"
login = "zarbex"
language = "de"
chat_delay_s = 4.0       # wie viele Sekunden der Chat hinter dem Bild herhinkt
# Facecam-Bereich im 1920x1080-Bild: x, y, Breite, Höhe. Weglassen = keine Facecam.
# Gemessen am 18.11.2026 (unten rechts). In GTA-Szenen ggf. neu prüfen.
facecam = { x = 1452, y = 762, w = 468, h = 318 }
# Schwarze Balken (z. B. 60 px oben bei "DAUERWERBESENDUNG") werden pro Clip automatisch erkannt.
# Nur bei Problemen fest einstellen: game_area = [62, 1080]

[[streamers]]
platform = "twitch"
login = "xrohat"
language = "de"
chat_delay_s = 4.0
# Gemessen am 18.11.2026 (oben rechts, darunter Spendenstand-Overlay)
facecam = { x = 1406, y = 104, w = 512, h = 288 }
